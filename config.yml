backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/pages/home.md"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Hero Title", name: "hero_title", widget: "string", default: "Your Premium Events and Production Partner" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string", default: "Twenty years. From South Africa to the Costa del Sol." }
          - { label: "Hero CTA Text", name: "hero_cta", widget: "string", default: "Enquire Now" }
          - { label: "About Title", name: "about_title", widget: "string", default: "Who We Are" }
          - { label: "About Description", name: "about_description", widget: "markdown" }
          - { label: "Events Title", name: "events_title", widget: "string", default: "What We Specialise In" }

      - file: "content/pages/about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Page Title", name: "title", widget: "string", default: "About Gatsby Productions" }
          - { label: "Page Description", name: "description", widget: "text" }
          - { label: "Content", name: "body", widget: "markdown" }

      - file: "content/pages/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - { label: "Page Title", name: "title", widget: "string", default: "Get In Touch" }
          - { label: "Page Description", name: "description", widget: "text" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Location", name: "location", widget: "string", default: "Marbella, Costa del Sol" }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings/general.md"
        label: "General Settings"
        name: "general"
        fields:
          - { label: "Site Title", name: "site_title", widget: "string", default: "Gatsby Productions" }
          - { label: "Site Description", name: "site_description", widget: "text" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
          - { label: "Contact Phone", name: "contact_phone", widget: "string" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string" }
          - { label: "Twitter URL", name: "twitter_url", widget: "string" }
          - { label: "YouTube URL", name: "youtube_url", widget: "string" }
