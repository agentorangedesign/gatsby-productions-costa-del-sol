backend:
  name: git-gateway
    branch: main

    media_folder: /images
    public_folder: /images

    collections:
      - name: pages
          label: Pages
              files:
                    - file: index.md
                            label: Home
                                    name: home
                                            fields:
                                                      - name: title
                                                                  label: Title
                                                                              widget: string
                                                                                        - name: description
                                                                                                    label: Description
                                                                                                                widget: text
                                                                                                                          - name: body
                                                                                                                                      label: Body
                                                                                                                                                  widget: markdown
