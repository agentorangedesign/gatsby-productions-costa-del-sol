backend:
  name: git-gateway
    branch: main

    media_folder: /images
    public_folder: /images

    collections:
      - name: pages
          label: Pages
              files:
                    - name: home
                            label: Home Page
                                    file: index.html
                                            fields:
                                                      - name: title
                                                                  label: Page Title
                                                                              widget: string
                                                                                          default: "Gatsby Productions Costa del Sol"
